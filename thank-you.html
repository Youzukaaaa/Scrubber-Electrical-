<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4b35">
<meta name="description" content="تم استلام طلبك بنجاح.">
<link rel="icon" href="assets/favicon.png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.png">
<title>تم استلام طلبك</title>

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1622352579430626');
fbq('track', 'PageView');

// Fire Purchase once for this order.
(function(){
  const params = new URLSearchParams(window.location.search);
  const rawValue = Number(params.get('value')) || 80;
  const value = Math.max(0, rawValue);
  const orderId = params.get('order_id') || ('page-' + Date.now());
  const storageKey = 'purchase_sent_' + orderId;

  try {
    if (sessionStorage.getItem(storageKey)) return;
    fbq('track', 'Purchase', { value: value, currency: 'SAR' }, { eventID: orderId });
    sessionStorage.setItem(storageKey, '1');
  } catch (e) {
    fbq('track', 'Purchase', { value: value, currency: 'SAR' }, { eventID: orderId });
  }
})();
</script>
<noscript>
<img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1622352579430626&ev=PageView&noscript=1" alt="">
</noscript>

<style>
:root{--g:#1f4b35;--gp:#e8f0e6;--c:#fbf8f0;--ink:#162019;--muted:#66716a;--line:#e3e7e2;--gold:#c59638}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--c);color:var(--ink);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;padding:20px}
.card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:44px 26px;text-align:center;box-shadow:0 25px 70px rgba(22,44,31,.10)}
.check{width:75px;height:75px;margin:auto auto 18px;border-radius:23px;background:var(--gp);color:var(--g);display:grid;place-items:center;font-size:40px;font-weight:900}
.card h1{margin:0 0 10px;font-size:35px;line-height:1.25}.card p{color:var(--muted);line-height:1.9;margin:0 0 22px}.card strong{color:var(--g)}
.btn{display:inline-flex;padding:13px 22px;background:var(--g);color:#fff;border-radius:14px;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <h1>تم استلام طلبك بنجاح</h1>
  <p>شكراً لك. وصلنا طلبك وسيتم التواصل معك لمتابعة التوصيل.<br><strong>الشحن داخل السعودية مجاني.</strong></p>
  <a class="btn" href="/">العودة للمتجر</a>
</main>
</body>
</html>
